name: Probe Setup Playwright

# TEMPORARY validation workflow for the setup-playwright composite action --
# removed before this branch is finalized. Not part of the PR.
on:
  push:
    branches: [playwright-ci-cache]

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-php
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-playwright
      - run: pnpm test:e2e
