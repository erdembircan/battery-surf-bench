name: Checks

on:
  workflow_call:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-php
      - run: composer lint

  php-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-php
      - run: composer test
      # Validate the container definitions — reflect every class against its
      # Services.php recipe — without building or writing the compiled
      # artifact (it is gitignored and regenerated on real builds, so there is
      # nothing to emit or diff here).
      - run: composer validate:container

  js-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: pnpm lint:js

  js-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: pnpm test

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: pnpm typecheck

  license:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - run: pnpm license:verify

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      # Parse every architecture contract chart in docs/contracts/ with Mermaid,
      # so a chart Mermaid rejects (and that therefore renders nowhere) fails
      # the build instead of going unnoticed.
      - run: pnpm contracts:verify

  plugin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-php
      - uses: ./.github/actions/setup-node
      # Build, zip and verify the production plugin exactly as a release does:
      # every check, the production build, the zip, then package:verify. The
      # build installs vendor/ without dev packages for the zip and puts them
      # back before it ends, so the vendor/ cache, saved only after a green
      # job, never holds the lean tree.
      - run: composer zip:production
      # The checks WordPress.org's upload form runs on a new plugin, with the
      # form's settings: the plugin_repo category without prefixing, errors
      # from severity 7 and warnings from severity 6. Like the form, the job
      # fails on errors only and shows warnings as annotations. Plugin Check
      # scans a folder rather than a zip: the plugin folder the zip holds,
      # which the build leaves in dist/battery-surf-bench/.
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/battery-surf-bench
          slug: battery-surf-bench
          categories: plugin_repo
          exclude-checks: prefixing
          error-severity: 7
          warning-severity: 6
          include-low-severity-errors: true
          # Findings already show as annotations and in the job log, so skip the
          # action's PR comment, which the read-only token can't post anyway.
          repo-token: ''
