name: Merge Checks

on:
  push:
    branches: [master]

permissions:
  contents: read

# Serialize master runs without cancelling: every merged commit still gets
# validated (cancel-in-progress: false), they just don't overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      # The reusable i18n job commits the regenerated .pot back to master.
      contents: write
    uses: ./.github/workflows/checks.yml
    with:
      commit-pot: true

  e2e:
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v6
      # `composer install` provides vendor/autoload.php, which the plugin's
      # main file requires -- the blueprint activates the plugin at boot, so
      # the autoloader must exist in the mounted plugin directory.
      - uses: ./.github/actions/setup-php
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-playwright
      # `pretest:e2e` builds the plugin; the Playwright config starts the
      # WordPress Playground server itself.
      - run: pnpm test:e2e
