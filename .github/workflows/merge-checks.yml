name: Merge Checks

on:
  push:
    branches: [master]

permissions:
  contents: read

# Serialize master runs without cancelling: every merged commit still gets
# validated (cancel-in-progress: false), they just don't overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    permissions:
      # The reusable i18n job commits the regenerated .pot back to master.
      contents: write
    uses: ./.github/workflows/checks.yml
    with:
      commit-pot: true

  # The end-to-end suites from e2e.yml, the same ones PR Checks runs. They run
  # again here because other merges can land between a pull request's run and
  # its own merge, so master can differ from what the pull request tested.
  e2e:
    needs: [checks]
    uses: ./.github/workflows/e2e.yml
