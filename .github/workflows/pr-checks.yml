name: PR Checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

# One in-flight run per PR: a new push cancels the previous run instead of
# letting it burn CI minutes validating a now-stale commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # commit-pot defaults to false, so PRs only validate the regenerated
    # .pot -- the committed template is refreshed on merge, not here.
    uses: ./.github/workflows/checks.yml
