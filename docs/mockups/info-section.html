<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Info section — live battery readouts</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Hanken+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  .panel{
    --surface:#f1f7fa; --surface-2:#fff; --surface-shadow:rgba(31,58,95,.08); --line:#e1edf2;
    --text:#1f3a5f; --text-strong:#1f3a5f; --text-soft:#5b7488; --label:rgba(31,58,95,.55);
    --bg:linear-gradient(180deg,#e7f6ff,#fff 60%); --accent:#2f9bb3; --good:#3fae57; --idle:#9fb0bd;
  }
  .panel[data-theme=dark]{
    --surface:rgba(3,22,32,.5); --surface-2:rgba(8,40,54,.6); --surface-shadow:rgba(0,0,0,.4); --line:rgba(160,225,240,.16);
    --text:#e6f7fb; --text-strong:#fff; --text-soft:rgba(230,247,251,.62); --label:rgba(230,247,251,.5);
    --bg:linear-gradient(175deg,#0a3a4f,#062b3d 70%); --accent:#46d6c4; --good:#5fd38b; --idle:rgba(230,247,251,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#cfcabf;font-family:'Hanken Grotesk',sans-serif;display:flex;gap:22px;flex-wrap:wrap;padding:24px}
  .panel{width:360px;padding:1.5rem;border-radius:18px;background:var(--bg);color:var(--text)}
  .head{font-size:.66rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--label);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
  .head::after{content:'';flex:1;height:1px;background:var(--line)}

  /* featured battery readout */
  .feat{position:relative;overflow:hidden;border-radius:14px;padding:1rem 1.1rem;background:var(--surface);box-shadow:inset 0 1px 3px var(--surface-shadow);margin-bottom:.7rem}
  .feat__row{display:flex;align-items:center;gap:1rem}
  .feat__num{font-family:'Space Mono',monospace;font-size:2.6rem;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
  .feat__pct{font-size:1.1rem;color:var(--text-soft);font-weight:700}
  .feat__label{font-size:.6rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--label);margin-bottom:.45rem}
  /* battery laid on its side — cap on the LEFT, always (charging or not) */
  .batt{position:relative;margin-left:auto;display:inline-flex;align-items:center;gap:3px;flex:0 0 auto}
  .batt__cap{order:0;flex:0 0 auto;width:6px;height:1.3rem;border-radius:3px 0 0 3px;background:var(--text-soft)}
  .batt__rig{order:1;position:relative;display:inline-flex}
  .batt__body{position:relative;width:7.4rem;height:3.4rem;border:3px solid var(--text-soft);border-radius:10px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 1px 3px var(--surface-shadow)}
  .batt__body::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 1.74rem,rgba(127,127,127,.13) 1.74rem,rgba(127,127,127,.13) calc(1.74rem + 1px));pointer-events:none}
  .feat__fill{position:absolute;inset-block:0;right:0}
  /* charging: USB-C cable slides in from the right, plugs into the right end (tip
     vanishing at the inner border); slides back out of view when charging stops */
  .batt__track{position:absolute;top:50%;left:calc(100% - 3px);transform:translateY(-50%);width:3.4rem;height:1.1rem;overflow:hidden;pointer-events:none}
  .batt__cable{position:absolute;top:50%;left:0;transform:translate(150%,-50%);width:1.7rem;height:0.46rem;border-radius:0 3px 3px 0;background:var(--good);transition:transform .5s cubic-bezier(.5,0,.2,1)}
  .batt__cable::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:0.4rem;height:0.86rem;border-radius:2px;background:var(--good)}
  .batt--chg .batt__cable{transform:translate(0,-50%)}

  /* 2x2 metric grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
  .stat{border-radius:13px;padding:.8rem .9rem;background:var(--surface);box-shadow:inset 0 1px 3px var(--surface-shadow)}
  .stat--wide{grid-column:1 / -1}
  .stat__label{font-size:.58rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--label)}
  .stat__val{font-family:'Space Mono',monospace;font-size:1.35rem;font-weight:700;margin-top:.35rem;color:var(--text-strong);font-variant-numeric:tabular-nums}
  .stat__val small{font-size:.8rem;color:var(--text-soft);font-weight:700}
  .muted{color:var(--idle)}
</style>
</head>
<body>
<script>
  const hsl = p => `hsl(${Math.round(p/100*120)}, 70%, 45%)`;
  function section(o){
    const c = hsl(o.batt);
    const rate = v => v==null ? `<span class="muted">—<small>%/h</small></span>` : `${v}<small>%/h</small>`;
    const tte = v => v==null ? `<span class="muted">—</span>` : v;
    return `<div class="head">Readouts</div>
      <div class="feat">
        <div class="feat__label">Battery</div>
        <div class="feat__row">
          <span class="feat__num" style="color:${c}">${o.batt}<span class="feat__pct">%</span></span>
          <span class="batt ${o.charging?'batt--chg':''}"><span class="batt__cap"></span><span class="batt__rig"><span class="batt__body"><span class="feat__fill" style="width:${o.batt}%;background:${c}"></span></span><span class="batt__track"><span class="batt__cable"></span></span></span></span>
        </div>
      </div>
      <div class="grid">
        <div class="stat"><div class="stat__label">Rate · 10 min</div><div class="stat__val">${rate(o.r10)}</div></div>
        <div class="stat"><div class="stat__label">Rate · session</div><div class="stat__val">${rate(o.rs)}</div></div>
        <div class="stat stat--wide"><div class="stat__label">Time to empty</div><div class="stat__val">${tte(o.tte)}</div></div>
      </div>`;
  }
  const idle = {batt:80, r10:null, rs:null, tte:null, charging:false};
  const live = {batt:64, r10:'7.2', rs:'6.8', tte:'8:54', charging:false};
  const charging = {batt:42, r10:null, rs:'2.1', tte:null, charging:true};
  for(const [t,o,tag] of [['light',live,'discharging'],['dark',charging,'charging'],['light',charging,'charging']]){
    const p=document.createElement('div');p.className='panel';p.dataset.theme=t;p.innerHTML=section(o);
    const note=document.createElement('div');note.style.cssText='font:700 .6rem Hanken Grotesk;letter-spacing:.1em;text-transform:uppercase;color:#8a8475;margin-top:10px';note.textContent=t+' · '+tag;
    p.append(note);document.body.append(p);
  }
</script>
</body>
</html>
