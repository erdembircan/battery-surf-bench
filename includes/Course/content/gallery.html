			<div class="bsb-gallery__header">
				<h1>Inside the Machine</h1>
				<p>
					A visual essay exploring the abstract landscapes of modern computing — from
					silicon wafer geometries to data-centre heat gradients. Twenty minimalist
					compositions rendered entirely in SVG.
				</p>
